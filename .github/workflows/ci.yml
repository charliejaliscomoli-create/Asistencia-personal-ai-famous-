name: Build application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extracted/Famous-asistent-main/package.json

      - name: Extract application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q "Famous-asistent-main oficial .zip" -d extracted

      - name: Install dependencies
        working-directory: extracted/Famous-asistent-main
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: extracted/Famous-asistent-main
        run: npm run lint

      - name: Build
        working-directory: extracted/Famous-asistent-main
        run: npm run build
        
